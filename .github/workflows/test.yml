name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Export Supabase credentials
        run: |
          # URL is determined by supabase/config.toml [api] port = 54321
          echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          # Try JSON first, fall back to text parsing
          ANON_KEY=$(npx supabase status --output json 2>/dev/null | jq -r '.anon_key // empty' 2>/dev/null)
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY=$(npx supabase status | grep 'anon key' | awk '{print $NF}')
          fi
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "TEST_ADMIN_EMAIL=admin@test.local" >> $GITHUB_ENV
          echo "TEST_ADMIN_PASSWORD=TestPassword123!" >> $GITHUB_ENV

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
