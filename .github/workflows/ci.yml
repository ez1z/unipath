name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fake local values only (stand-in Telegram token, dev secret); no real service is used.
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- migrations
          test -z "$(git status --porcelain -- migrations)"
      # Local D1 only (.wrangler/state on the runner); no Cloudflare account is used.
      - name: Migrations apply and the demo seed loads
        run: pnpm db:migrate && pnpm db:seed

  e2e:
    name: Playwright (phone + desktop)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Fake local values only (stand-in Telegram token, dev secret); no real service is used.
      - run: cp .dev.vars.example .dev.vars
      # The pages read the local D1 (.wrangler/state on the runner): load the demo seed.
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm e2e
      - name: Lighthouse, Slow 3G phone (performance 90+, first content < 2 s)
        run: |
          pnpm preview --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/tk && break; sleep 1; done
          pnpm lighthouse
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
